spring.application.name=clientes

spring.datasource.url=jdbc:postgresql://localhost:5432/clientesdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false

# Esta propiedad controla si flyway está habilitado o no
spring.flyway.enabled=false

# --- Observabilidad ---
# Trazar el 100% de las requests
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info,prometheus
# Tag común a todas las métricas, para identificar esta app en Prometheus
management.metrics.tags.application=${spring.application.name}
# Histograma de latencias HTTP, necesario para calcular percentiles (p95) en Prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
